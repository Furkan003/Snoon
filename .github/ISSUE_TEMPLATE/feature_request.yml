name: Feature request
description: Suggest a focused improvement for Snoon
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the real-life situation rather than only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: reliability
    attributes:
      label: Alarm, permission or privacy impact
      description: Explain whether the idea changes scheduling, sound, notification, backup or data behavior.
