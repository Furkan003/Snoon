name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies and verify source
        run: |
          flutter pub get
          flutter gen-l10n
          test "$(tr -d '[:space:]' < untranslated.json)" = "{}"
          flutter analyze
          flutter test
          (cd android && ./gradlew :app:lintDebug)

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/snoon-upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=snoon-upload-keystore.jks\n'
          } > android/key.properties

      - name: Build signed Android packages
        run: |
          flutter build apk --release
          flutter build appbundle --release
          mkdir release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Snoon-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release/Snoon-${GITHUB_REF_NAME}.aab"
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag --generate-notes --title "Snoon $GITHUB_REF_NAME"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/snoon-upload-keystore.jks
