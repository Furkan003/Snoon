name: Flutter CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Reject signing secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(key\.properties|.*\.(jks|keystore))$'; then
            echo "Signing secrets must not be committed."
            exit 1
          fi

      - name: Verify translations are complete
        shell: bash
        run: test "$(tr -d '[:space:]' < untranslated.json)" = "{}"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: flutter build apk --debug
